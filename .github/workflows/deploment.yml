name: Deployment Project
on: push
jobs: 
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: install Node Js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm test
  deploy:
    runs-on : ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3 
      - name: install Node js
        uses: actions/setup-node@v3
        with: 
          node-version: 18
      - name: install dependancies
        run : npm ci
      - name: Build project
        run: npm run build
      - name: Deploy Project
        run : echo "Deploying the code ....."
      